<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student SQL Lab</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #20232a;
      color: white;
      padding: 18px 24px;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    header p {
      margin: 5px 0 0;
      color: #bbb;
    }

    .container {
      max-width: 1300px;
      margin: 22px auto;
      padding: 0 20px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
    }

    button, .file-button {
      border: none;
      border-radius: 6px;
      padding: 10px 15px;
      font-size: 14px;
      cursor: pointer;
      background: #2563eb;
      color: white;
      display: inline-block;
    }

    button:hover, .file-button:hover {
      opacity: .88;
    }

    .secondary { background: #555; }
    .success-button { background: #16803c; }
    .danger { background: #dc2626; }

    input[type="file"] {
      display: none;
    }

    .layout {
      display: grid;
      grid-template-columns: 230px 1fr;
      gap: 18px;
    }

    .panel {
      background: white;
      border-radius: 8px;
      padding: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
      margin-bottom: 18px;
    }

    h2 {
      margin-top: 0;
      font-size: 18px;
    }

    #tables {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    #tables li {
      padding: 9px;
      margin-bottom: 5px;
      background: #f1f5f9;
      border-radius: 5px;
      cursor: pointer;
      word-break: break-word;
    }

    #tables li:hover {
      background: #dbeafe;
    }

    textarea {
      width: 100%;
      min-height: 300px;
      resize: vertical;
      padding: 15px;
      border: 1px solid #444;
      border-radius: 6px;
      background: #1e1e1e;
      color: #d4d4d4;
      font-family: Consolas, Monaco, monospace;
      font-size: 15px;
      line-height: 1.5;
    }

    #message {
      display: none;
      margin-top: 12px;
      padding: 10px;
      border-radius: 5px;
    }

    .message-success {
      display: block !important;
      background: #dcfce7;
      color: #166534;
    }

    .message-error {
      display: block !important;
      background: #fee2e2;
      color: #991b1b;
    }

    .table-wrapper {
      overflow-x: auto;
      margin-bottom: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 9px;
      text-align: left;
    }

    th {
      background: #f1f5f9;
    }

    tr:nth-child(even) {
      background: #fafafa;
    }

    .small {
      color: #666;
      font-size: 13px;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #777;
      font-size: 13px;
    }

    @media (max-width: 800px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Student SQL Lab</h1>
  <p>Practice SQL directly in your browser</p>
</header>

<div class="container">

  <div class="panel">
    <div class="toolbar">

      <label class="file-button">
        📂 Import Database
        <input
          type="file"
          id="databaseFile"
          accept=".db,.sqlite,.sqlite3"
        >
      </label>

      <label class="file-button">
        📄 Import SQL
        <input
          type="file"
          id="sqlFile"
          accept=".sql"
        >
      </label>

      <button
        class="success-button"
        onclick="exportDatabase()"
      >
        💾 Export Database
      </button>

      <button
        class="secondary"
        onclick="loadExample()"
      >
        Load Example
      </button>

      <button
        class="danger"
        onclick="resetDatabase()"
      >
        Reset
      </button>

    </div>

    <div id="message"></div>
  </div>


  <div class="layout">

    <div>

      <div class="panel">

        <h2>Tables</h2>

        <p class="small">
          Click a table to view its data.
        </p>

        <ul id="tables">
          <li>Loading...</li>
        </ul>

      </div>

    </div>


    <div>

      <div class="panel">

        <h2>SQL Editor</h2>

        <textarea id="sqlEditor">SELECT * FROM students;</textarea>

        <br><br>

        <button onclick="runSQL()">
          ▶ Run SQL
        </button>

      </div>


      <div class="panel">

        <h2>Results</h2>

        <div id="results">
          Run a query to see the results.
        </div>

      </div>

    </div>

  </div>

</div>


<footer>
  Student SQL Lab • SQLite runs locally in your browser
</footer>


<script>

let SQL;
let db;


// -----------------------
// START
// -----------------------

async function start() {

  try {

    SQL = await initSqlJs({
      locateFile: file =>
        "https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/" + file
    });

    createDefaultDatabase();

  } catch (error) {

    showMessage(
      "Could not start SQLite: " + error.message,
      "error"
    );

  }

}


// -----------------------
// DEFAULT DATABASE
// -----------------------

// -----------------------
// RUN SQL
// -----------------------

function runSQL() {

  if (!db) {
    showMessage(
      "SQL database is still loading. Please try again.",
      "error"
    );
    return;
  }

  clet query = document
  .getElementById("sqlEditor")
  .value;

// Allow // to be used as comments
query = query
  .split("\n")
  .filter(line => !line.trim().startsWith("//"))
  .join("\n")
  .trim();

  const resultsBox =
    document.getElementById("results");

  // Empty SQL
  if (!query) {
    showMessage(
      "SQL Error: Please enter a SQL statement.",
      "error"
    );

    resultsBox.innerHTML =
      "<p>❌ No SQL statement entered.</p>";

    return;
  }

  try {

    const results = db.exec(query);

    displayResults(results);
    refreshTables();

    showMessage(
      "✓ SQL executed successfully.",
      "success"
    );

  } catch (error) {

    console.error("SQL Error:", error);

    showMessage(
      "❌ SQL Error: " + error.message,
      "error"
    );

    resultsBox.innerHTML =
      "<p><strong>❌ SQL Error</strong></p>" +
      "<pre style='white-space:pre-wrap;color:#b91c1c;'>" +
      escapeHTML(error.message) +
      "</pre>";
  }
}

// -----------------------
// DISPLAY RESULTS
// -----------------------

function displayResults(results) {

  const output =
    document.getElementById("results");

  if (results.length === 0) {

    output.innerHTML =
      "<p>Command completed successfully.</p>";

    return;

  }

  let html = "";

  results.forEach(result => {

    html += '<div class="table-wrapper">';
    html += "<table>";

    html += "<thead><tr>";

    result.columns.forEach(column => {

      html +=
        "<th>" +
        escapeHTML(column) +
        "</th>";

    });

    html += "</tr></thead><tbody>";


    result.values.forEach(row => {

      html += "<tr>";

      row.forEach(value => {

        html +=
          "<td>" +
          escapeHTML(
            value === null
              ? "NULL"
              : String(value)
          ) +
          "</td>";

      });

      html += "</tr>";

    });


    html += "</tbody></table>";
    html += "</div>";

  });

  output.innerHTML = html;

}


// -----------------------
// TABLE LIST
// -----------------------

function refreshTables() {

  const list =
    document.getElementById("tables");

  list.innerHTML = "";

  try {

    const result = db.exec(`
      SELECT name
      FROM sqlite_master
      WHERE type='table'
      AND name NOT LIKE 'sqlite_%'
      ORDER BY name;
    `);

    if (
      result.length === 0 ||
      result[0].values.length === 0
    ) {

      list.innerHTML =
        "<li>No tables</li>";

      return;

    }

    result[0].values.forEach(row => {

      const tableName = row[0];

      const item =
        document.createElement("li");

      item.textContent =
        "▦ " + tableName;

      item.onclick = () =>
        viewTable(tableName);

      list.appendChild(item);

    });

  } catch (error) {

    console.error(error);

  }

}


// -----------------------
// VIEW TABLE
// -----------------------

function viewTable(tableName) {

  const safeName =
    tableName.replace(/"/g, '""');

  document.getElementById(
    "sqlEditor"
  ).value =
    `SELECT * FROM "${safeName}";`;

  runSQL();

}


// -----------------------
// IMPORT DATABASE
// -----------------------

document.getElementById(
  "databaseFile"
).addEventListener(
  "change",
  async function(event) {

    const file =
      event.target.files[0];

    if (!file) return;

    try {

      const buffer =
        await file.arrayBuffer();

      const data =
        new Uint8Array(buffer);

      const newDatabase =
        new SQL.Database(data);

      if (db) {
        db.close();
      }

      db = newDatabase;

      refreshTables();

      document.getElementById(
        "results"
      ).innerHTML =
        "<p>Database imported successfully.</p>";

      showMessage(
        "Loaded database: " + file.name,
        "success"
      );

    } catch (error) {

      showMessage(
        "Could not open database: " +
        error.message,
        "error"
      );

    }

    event.target.value = "";

  }
);


// -----------------------
// IMPORT SQL FILE
// -----------------------

document.getElementById(
  "sqlFile"
).addEventListener(
  "change",
  async function(event) {

    const file =
      event.target.files[0];

    if (!file) return;

    try {

      const text =
        await file.text();

      document.getElementById(
        "sqlEditor"
      ).value = text;

      showMessage(
        "SQL file loaded into the editor. Press Run SQL to execute it.",
        "success"
      );

    } catch (error) {

      showMessage(
        "Could not read SQL file.",
        "error"
      );

    }

    event.target.value = "";

  }
);


// -----------------------
// EXPORT DATABASE
// -----------------------

function exportDatabase() {

  if (!db) return;

  const data =
    db.export();

  const blob =
    new Blob(
      [data],
      {
        type:
          "application/x-sqlite3"
      }
    );

  const url =
    URL.createObjectURL(blob);

  const link =
    document.createElement("a");

  link.href = url;

  link.download =
    "student-database.sqlite";

  document.body.appendChild(link);

  link.click();

  link.remove();

  URL.revokeObjectURL(url);

  showMessage(
    "Database exported.",
    "success"
  );

}


// -----------------------
// EXAMPLE
// -----------------------

function loadExample() {

  document.getElementById(
    "sqlEditor"
  ).value =
`SELECT name, class, grade
FROM students
WHERE grade >= 85
ORDER BY grade DESC;`;

}


// -----------------------
// RESET
// -----------------------

function resetDatabase() {

  const confirmed =
    confirm(
      "Reset the database? Your current changes will be lost."
    );

  if (!confirmed) return;

  createDefaultDatabase();

  document.getElementById(
    "sqlEditor"
  ).value =
    "SELECT * FROM students;";

  document.getElementById(
    "results"
  ).innerHTML =
    "<p>Database reset.</p>";

  showMessage(
    "Database reset successfully.",
    "success"
  );

}


// -----------------------
// MESSAGE
// -----------------------

function showMessage(text, type) {

  const box =
    document.getElementById("message");

  box.textContent = text;

  box.className =
    type === "success"
      ? "message-success"
      : "message-error";

}


// -----------------------
// HTML SAFETY
// -----------------------

function escapeHTML(value) {

  const div =
    document.createElement("div");

  div.textContent = value;

  return div.innerHTML;

}


start();

</script>

</body>
</html>
