worker_processes auto;
events { worker_connections 512; }
http {
  include /etc/nginx/mime.types;
  # Only Caddy is host-published; it sanitizes incoming forwarding headers.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
  limit_req_zone $binary_remote_addr zone=guest:10m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
  server {
    listen 8080;
    root /usr/share/nginx/html;
    client_max_body_size 6m;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;
    location = /api/guest {
      limit_req zone=guest burst=30 nodelay;
      limit_req_status 429;
      proxy_pass http://backend:8000;
      proxy_read_timeout 45s;
      proxy_set_header Host $host;
    }
    location = /api/login {
      limit_req zone=login burst=10 nodelay;
      limit_req_status 429;
      proxy_pass http://backend:8000;
      proxy_set_header Host $host;
    }
    location /api/ {
      limit_req zone=api burst=20 nodelay;
      limit_req_status 429;
      proxy_pass http://backend:8000;
      proxy_read_timeout 45s;
      proxy_set_header Host $host;
    }
    location / { try_files $uri /index.html; }
  }
}
