services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lab_admin
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/configure.py first}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    command: [postgres, -c, max_connections=50, -c, shared_buffers=128MB, -c, temp_file_limit=65536, -c, log_statement=none]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [database]
    mem_limit: 1g
    cpus: 1.5
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U lab_admin -d postgres']
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_HOST: postgres
      STATE_PATH: /data/platform.sqlite
    volumes: [platform_data:/data]
    networks: [database, web]
    depends_on:
      postgres: {condition: service_healthy}
    mem_limit: 512m
    cpus: 1
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
  frontend:
    build: ./frontend
    restart: unless-stopped
    networks: [web]
    depends_on:
      backend: {condition: service_healthy}
    mem_limit: 128m
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-:80}
    ports:
      - '${HTTP_PORT:-8080}:80'
      - '${HTTPS_PORT:-8443}:443'
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [web]
    depends_on: [frontend]
    mem_limit: 128m
volumes:
  postgres_data:
  platform_data:
  caddy_data:
  caddy_config:
networks:
  database: {internal: true}
  web:
