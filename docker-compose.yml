services:

  postgres:
    image: postgres:17
    container_name: sql-lab-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: sqllab
      POSTGRES_USER: sqladmin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

    networks:
      - sql-lab-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sqladmin -d sqllab"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: sql-lab-backend
    restart: unless-stopped

    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: sqllab
      DATABASE_USER: sqladmin
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - sql-lab-network

  frontend:
    build: ./frontend
    container_name: sql-lab-frontend
    restart: unless-stopped

    depends_on:
      - backend

    networks:
      - sql-lab-network

  nginx:
    image: nginx:alpine
    container_name: sql-lab-nginx
    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - frontend
      - backend

    networks:
      - sql-lab-network

volumes:
  postgres_data:

networks:
  sql-lab-network:
    driver: bridge
